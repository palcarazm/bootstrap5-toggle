name: CI

on:
  push:
    branches:
      - "v*"
      - "develop/*"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - "v*"
      - "develop/*"

jobs:
  build-and-test:
    name: Run build with unit test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install
      - name: Lint code
        run: npm run lint
      - name: Build project
        run: npm run build
      - name: Unit test
        run: npm run test:unit
      - name: Upload coverage report to Github
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: coverage
      - name: Upload coverage report to Coveralls
        #v2.3.7
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          flag-name: coverage-report-${{ matrix.node-version }}
          parallel: true
        continue-on-error: true

  coverage-finished:
    name: Publish coverage report to Coveralls
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        id: coveralls
        #v2.3.7
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e
        with:
          parallel-finished: true
          carryforward: "coverage-report-22.x,coverage-report-24.x"
        continue-on-error: true
  
      - name: Check Coveralls status
        id: check-status
        if: always()
        run: |
          if [ "${{ steps.coveralls.outcome }}" == "success" ]; then
            echo "✅ Coveralls report submitted successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ steps.coveralls.outcome }}" == "failure" ]; then
            echo "⚠️ Coveralls service is temporarily unavailable"
            echo "status=neutral" >> $GITHUB_OUTPUT
          else
            echo "❓ Coveralls status unknown: ${{ steps.coveralls.outcome }}"
            echo "status=neutral" >> $GITHUB_OUTPUT
          fi
      
      - name: Set neutral status (if needed)
        if: steps.check-status.outputs.status == 'neutral'
        uses: actions/github-script@v7
        with:
          script: |
            const { context } = require('@actions/github');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            
            await github.rest.checks.create({
              owner,
              repo,
              name: 'Coveralls / Coverage Report',
              head_sha: sha,
              status: 'completed',
              conclusion: 'neutral',
              output: {
                title: 'Coveralls service temporarily unavailable',
                summary: '⚠️ Coveralls is currently experiencing issues. The coverage report will be submitted when the service is available again.\n\nThis check is marked as neutral and does not block the PR.'
              }
            });

  cypress:
    name: Run e2e tests with Cypress
    runs-on: ubuntu-latest
    needs: build-and-test
    container:
      image: cypress/browsers:node-24.12.0-chrome-143.0.7499.169-1-ff-146.0.1-edge-143.0.3650.96-1
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: npm install
      - name: Build project
        run: npm run build
      - name: Cypress run
        #v6.10.8
        uses: cypress-io/github-action@948d67d3074f1bbb6379c8bdbb04e95d2f8e593f
        with:
          browser: chrome

  analyze:
    name: Analyze code with CodeQL
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sonarcloud:
    name: Analyze code with SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if only dependencies changed
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES" | grep -q -v -E '^(package.json|./**.md|./**.yml)'
          
          if echo "$CHANGED_FILES" | grep -q -v -E '^(package.json|./**.md|./**.yml)'; then
            echo "has_code_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Code changes detected"
          else
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "📦 Only dependency, documentation or ci/cd files changed"
          fi

      - name: Download coverage artifact
        if: steps.check-changes.outputs.has_code_changes == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-22.x
          path: coverage

      - name: SonarQube Scan
        if: steps.check-changes.outputs.has_code_changes == 'true'
        # v7.0.0
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}