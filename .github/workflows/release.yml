name: Publish Package to npmJS

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm install
      
      - name: Determine npm tag
        id: npm-tag
        run: |
          RELEASE_NAME="${{ github.event.release.name }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          
          echo "📦 Release name: $RELEASE_NAME"
          echo "🏷️ Release tag: $RELEASE_TAG"
          
          if [ "${{ github.event.release.prerelease }}" == "true" ]; then
            echo "🔬 Prerelease detected - using 'next' tag"
            echo "tag=next" >> $GITHUB_OUTPUT
          else
            echo "🚀 Full release detected - using 'latest' tag"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi
      
      - name: Stage publish to npm
        run: |
          npm stage publish --provenance --access public --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}